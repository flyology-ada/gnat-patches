name: Publish patchset release

on:
  workflow_dispatch:
    inputs:
      patchset_version:
        description: Exact patchset version to publish
        required: true
        type: string
        default: 1.1.1
      gcc_version:
        description: Exact GCC source version targeted by the aggregate
        required: true
        type: string
        default: 16.2.0
      publish:
        description: Confirm creation of a new public GitHub release
        required: true
        type: boolean
        default: false
      make_latest:
        description: Mark the validated stable release as the repository latest
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.patchset_version }}-gcc-${{ inputs.gcc_version }}
  cancel-in-progress: false

jobs:
  release:
    name: Patchset ${{ inputs.patchset_version }} for GCC ${{ inputs.gcc_version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      source_version: ${{ steps.source-version.outputs.value }}
    env:
      GNAT_PATCHES_CACHE: ${{ github.workspace }}/.cache
      GH_TOKEN: ${{ github.token }}
      PATCHSET_VERSION: ${{ inputs.patchset_version }}
      GCC_VERSION: ${{ inputs.gcc_version }}
    steps:
      - name: Check out patchsets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Require a successful source-build matrix
        run: |
          run_id=$(gh run list --workflow validate.yml --commit "$GITHUB_SHA" \
            --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "error: no successful validation run exists for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "publication gate: validation run $run_id"
          echo "VALIDATION_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Prove aggregate completeness
        run: ./scripts/manifest.py validate --patchset "$PATCHSET_VERSION" --gcc "$GCC_VERSION"

      - name: Restore verified source download
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache
          key: release-source-${{ inputs.patchset_version }}-gcc-${{ inputs.gcc_version }}-${{ hashFiles('sources/*.toml', 'patchsets/**/*.toml', 'bundles/**/manifest.toml') }}

      - name: Resolve source version
        id: source-version
        run: |
          source_version=$(./scripts/manifest.py patchset "$PATCHSET_VERSION" "$GCC_VERSION" source_version)
          [[ "$source_version" == "$GCC_VERSION" ]]
          echo "SOURCE_VERSION=$source_version" >> "$GITHUB_ENV"
          echo "value=$source_version" >> "$GITHUB_OUTPUT"

      - name: Check aggregate against pinned source
        run: |
          ./scripts/fetch-source.sh "$SOURCE_VERSION" work/source
          ./scripts/apply-patchset.sh "$PATCHSET_VERSION" "$SOURCE_VERSION" work/source

      - name: Package complete aggregate
        run: |
          ./scripts/package-patchset.sh \
            "$PATCHSET_VERSION" "$SOURCE_VERSION" dist/release
          ./scripts/fetch-binutils-source.sh work/binutils-source
          archive=$(./scripts/manifest.py helper 2.46.1 archive)
          expected=$(./scripts/manifest.py helper 2.46.1 sha512)
          cp ".cache/sources/$archive" "dist/release/$archive"
          printf '%s  %s\n' "$expected" "$archive" \
            >"dist/release/$archive.sha512"

      - name: Download validated native toolchains
        run: |
          for platform in linux-x86_64 linux-aarch64 macos-aarch64; do
            destination="dist/toolchains/$platform"
            mkdir -p "$destination"
            gh run download "$VALIDATION_RUN_ID" \
              --name "toolchain-patchset-$PATCHSET_VERSION-gcc-$SOURCE_VERSION-$platform" \
              --dir "$destination"
            (cd "$destination" && shasum -a 256 -c ./*.sha256)
          done

      - name: Generate Alire toolchain index entry
        run: |
          ./scripts/generate-alire-index.py \
            "$PATCHSET_VERSION" "$SOURCE_VERSION" \
            dist/toolchains dist/alire-index

      - name: Retain release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patchset-${{ inputs.patchset_version }}-gcc-${{ steps.source-version.outputs.value }}
          path: |
            dist/release/*.tar.gz*
            dist/release/*.tar.xz*
            dist/toolchains/**/*.tar.gz*
            dist/alire-index/index/**/*.toml
          retention-days: 30
          if-no-files-found: error

      - name: Publish immutable prerelease candidate
        if: inputs.publish
        run: |
          tag="patchset-$PATCHSET_VERSION-gcc-$SOURCE_VERSION"
          ./scripts/check-release-identity-available.sh "$GITHUB_REPOSITORY" "$tag"
          printf '%s\n' \
            "Complete accepted patch aggregate for GCC $SOURCE_VERSION." \
            "Patchset version: $PATCHSET_VERSION" \
            "Pinned source version: $SOURCE_VERSION" \
            "The patch archive contains the ordered series, manifests, patches, tests, and SHA-256 inventory." \
            "Validated gnat_flyology_native toolchains are included for Linux x86-64, Linux AArch64, and macOS AArch64." \
            "Alire index: alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community" \
            > dist/release/RELEASE_NOTES.md
          gh release create "$tag" \
            dist/release/*.tar.gz \
            dist/release/*.tar.gz.sha256 \
            dist/release/*.tar.xz \
            dist/release/*.tar.xz.sha512 \
            dist/toolchains/*/*.tar.gz \
            dist/toolchains/*/*.tar.gz.sha256 \
            dist/alire-index/index/gn/gnat_flyology_native/*.toml \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "GNAT patchset $PATCHSET_VERSION for GCC $SOURCE_VERSION" \
            --notes-file dist/release/RELEASE_NOTES.md

  consumer:
    name: Alire consumer · ${{ matrix.platform }}
    if: inputs.publish
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          - {platform: macos-aarch64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET_VERSION: ${{ inputs.patchset_version }}
      GCC_VERSION: ${{ inputs.gcc_version }}
    steps:
      - name: Check out patchsets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
      - name: Build candidate index
        run: |
          patchset="$PATCHSET_VERSION"
          source_version="$GCC_VERSION"
          tag="patchset-$patchset-gcc-$source_version"
          mkdir -p work/index/index/gn/gnat_flyology_native
          printf 'version = "1.4.0"\n' >work/index/index/index.toml
          gh release download "$tag" \
            --pattern "gnat_flyology_native-$source_version-patchset.$patchset.toml" \
            --dir work/index/index/gn/gnat_flyology_native
      - name: Select locally and run the regression
        run: |
          patchset="$PATCHSET_VERSION"
          source_version="$GCC_VERSION"
          alire_settings="$RUNNER_TEMP/alire-settings"
          mkdir -p "$alire_settings"
          alr -s "$alire_settings" -n -q init --bin consumer
          cd consumer
          alr -s "$alire_settings" -n index \
            --add="$GITHUB_WORKSPACE/work/index" --name=release_candidate
          alr -s "$alire_settings" -n index \
            --add=git+https://github.com/alire-project/alire-index.git \
            --name=community
          alr -s "$alire_settings" -n toolchain --select --local \
            "gnat_flyology_native=$source_version-patchset.$patchset" \
            gprbuild=26.0.1
          gnatmake=$(alr -s "$alire_settings" exec -- which gnatmake)
          toolchain=$(cd "$(dirname "$gnatmake")/.." && pwd)
          "$GITHUB_WORKSPACE/scripts/run-regressions.sh" "$toolchain" \
            "$patchset" "$source_version" patched
          gprbuild=$(alr -s "$alire_settings" exec -- which gprbuild)
          gprbuild_root=$(cd "$(dirname "$gprbuild")/.." && pwd)
          "$GITHUB_WORKSPACE/ci/test-packaged-toolchain.sh" "$toolchain" \
            "$gprbuild_root" "${{ matrix.platform }}"

  publish:
    name: Promote validated release
    if: inputs.publish
    needs: [release, consumer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PATCHSET_VERSION: ${{ inputs.patchset_version }}
      SOURCE_VERSION: ${{ needs.release.outputs.source_version }}
      MAKE_LATEST: ${{ inputs.make_latest }}
    steps:
      - name: Promote without changing assets
        run: |
          tag="patchset-$PATCHSET_VERSION-gcc-$SOURCE_VERSION"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest="$MAKE_LATEST"
