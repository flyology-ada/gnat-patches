name: Validate patchsets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out patchsets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify manifests and fixtures
        run: ./scripts/verify-repository.sh
      - name: Check whitespace
        run: git diff --check HEAD

  compiler:
    name: GCC ${{ matrix.version }} · ${{ matrix.platform }}
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: 13.2.0, major: 13, platform: linux-x86_64, runner: ubuntu-24.04, before: control, after: control}
          - {version: 14.2.0, major: 14, platform: linux-x86_64, runner: ubuntu-24.04, before: fail, after: patched}
          - {version: 15.3.0, major: 15, platform: linux-x86_64, runner: ubuntu-24.04, before: fail, after: patched}
          - {version: 16.1.0, major: 16, platform: linux-x86_64, runner: ubuntu-24.04, before: fail, after: patched}
          - {version: 13.2.0, major: 13, platform: linux-arm64, runner: ubuntu-24.04-arm, before: control, after: control}
          - {version: 14.2.0, major: 14, platform: linux-arm64, runner: ubuntu-24.04-arm, before: fail, after: patched}
          - {version: 15.3.0, major: 15, platform: linux-arm64, runner: ubuntu-24.04-arm, before: fail, after: patched}
          - {version: 16.1.0, major: 16, platform: linux-arm64, runner: ubuntu-24.04-arm, before: fail, after: patched}
          - {version: 13.2.0, major: 13, platform: macos-arm64, runner: macos-15, before: control, after: control}
          - {version: 14.2.0, major: 14, platform: macos-arm64, runner: macos-15, before: fail, after: patched}
          - {version: 15.3.0, major: 15, platform: macos-arm64, runner: macos-15, before: fail, after: patched}
          - {version: 16.1.0, major: 16, platform: macos-arm64, runner: macos-15, before: fail, after: patched}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GNAT_PATCHES_CACHE: ${{ github.workspace }}/.cache
      GNAT_PATCHES_JOBS: 2
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Check out patchsets
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Reclaim Linux runner space
        if: runner.os == 'Linux'
        run: ./ci/reclaim-space.sh

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk texinfo \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev
          if [[ "${{ matrix.version }}:${{ matrix.platform }}" == "13.2.0:linux-arm64" ]]; then
            sudo apt-get install -y gnat-13
          fi

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install gmp mpfr libmpc

      - name: Restore verified downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ matrix.version }}-${{ hashFiles('sources/*.toml', 'ci/bootstrap.tsv') }}

      - name: Resolve bootstrap compiler
        run: |
          bootstrap=$(./scripts/fetch-bootstrap.sh "${{ matrix.version }}" work/bootstrap)
          echo "BOOTSTRAP_ROOT=$bootstrap" >> "$GITHUB_ENV"
          echo "$bootstrap/bin" >> "$GITHUB_PATH"

      - name: Run unpatched control
        run: ./scripts/run-regressions.sh "$BOOTSTRAP_ROOT" "${{ matrix.before }}"

      - name: Fetch pinned GCC source
        run: ./scripts/fetch-source.sh "${{ matrix.version }}" work/source

      - name: Apply complete patchset
        run: ./scripts/apply-patchset.sh 1.0.0 "${{ matrix.major }}" work/source

      - name: Build GCC and GNAT from source
        run: ./scripts/build-gnat.sh work/source build/gcc install/gcc

      - name: Run built-compiler regressions
        run: ./scripts/run-regressions.sh install/gcc "${{ matrix.after }}"

      - name: Collect failure logs
        if: failure()
        run: ./ci/collect-logs.sh build logs

      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: failure-${{ matrix.version }}-${{ matrix.platform }}
          path: logs/
          retention-days: 14
          if-no-files-found: error
