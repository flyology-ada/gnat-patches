name: Agent resources

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gnat-patches-agent-resources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install APM
        run: pip install apm-cli==0.28.0
      - name: Reproduce agent resources
        run: |
          apm install --frozen
          apm compile --target codex
          apm audit --ci
          git diff --exit-code -- AGENTS.md website/AGENTS.md apm.lock.yaml
